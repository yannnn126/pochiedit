<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PochiEdit</title>
<script>(function(){try{var q=location.search;if(/desktop=1/.test(q)){sessionStorage.setItem("pe_desktop","1");return;}if(sessionStorage.getItem("pe_desktop"))return;var m=matchMedia("(pointer:coarse)").matches&&Math.min(screen.width,screen.height)<820;if(m)location.replace("mobile.html");}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif:ital,wght@1,700;1,900&family=Noto+Serif+TC:wght@700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#23262d; --panel:#2b2f37; --raised:#353a44; --line:#424854; --text:#e9ebef; --muted:#9aa1ad;
  --accent:#f2c14e; --accent-ink:#2a2208; --danger:#ef6b5b; --ok:#6fcf97;
  --stage:#1b1d22; --r-s:6px; --r-m:10px;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{display:grid;grid-template-rows:52px 1fr}

/* 上方工具列 */
#top{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-style:italic;font-weight:900;font-size:21px;letter-spacing:.01em}
.brand a{color:var(--muted);font:500 12px "Noto Sans TC",sans-serif;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-left:4px}
.brand a:hover{color:var(--text)}
.pages{display:flex;background:var(--bg);border-radius:8px;padding:3px}
.pages button{border:0;background:none;padding:6px 14px;border-radius:6px;color:var(--muted)}
.pages button.on{background:var(--raised);color:var(--text)}
.tb{display:flex;align-items:center;gap:4px}
.tb .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.ib{border:0;background:none;height:34px;min-width:34px;padding:0 8px;border-radius:var(--r-s);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text)}
.ib:hover:not(:disabled){background:var(--raised)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px}
.ib.hold:active{background:var(--accent);color:var(--accent-ink)}
#zoomLbl{min-width:52px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.export{display:flex;align-items:center;gap:8px}
.export select,.export input[type=range]{height:32px}
select,input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:5px 8px}
#expQWrap{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
#expQWrap input{width:80px}

/* 主要版面 */
#app{display:grid;grid-template-columns:78px 304px 1fr;min-height:0}
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:2px;overflow-y:auto}
.rb{border:0;background:none;border-radius:var(--r-m);padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;position:relative}
.rb svg{width:22px;height:22px}
.rb:hover{background:var(--raised);color:var(--text)}
.rb.on{background:var(--raised);color:var(--text)}
.rb.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.rail-sep{height:1px;background:var(--line);margin:6px 8px}

#panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;min-width:0;padding:16px 16px 40px}
#panel h2{font-size:18px;margin:0 0 4px;font-weight:700}
#panel .lead{color:var(--muted);margin:0 0 16px;line-height:1.6;font-size:13px}
.sec{border-top:1px solid var(--line);padding:14px 0 6px}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec h3{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--text)}
.note{color:var(--muted);font-size:12px;line-height:1.6;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--text)}
.chip:hover{border-color:var(--muted)}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:var(--r-s);padding:8px 10px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.block{width:100%;padding:10px}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:4px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--raised);color:var(--text)}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row label{flex:0 0 64px;color:var(--muted);font-size:13px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row output{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.row input[type=number]{width:84px}
.row input[type=color]{width:40px;height:30px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);padding:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;cursor:pointer}
.toggle input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:18px}
.toggle small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.card{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-m);padding:10px 12px;text-align:left;width:100%;display:block;color:var(--text);margin-bottom:6px}
.card b{display:block;font-size:13px}
.card span{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel) inset}
.sw.trans{background:conic-gradient(#888 25%,#ddd 0 50%,#888 0 75%,#ddd 0) 0 0/10px 10px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-m);padding:26px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.drop svg{width:34px;height:34px;color:var(--muted)}
.drop small{color:var(--muted)}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.styles button{height:54px;border:1px solid var(--line);border-radius:var(--r-s);background:#3b404b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.styles button{min-width:0}
.styles button canvas{width:100%;max-width:60px;height:auto;aspect-ratio:120/56}
.styles button.on{border-color:var(--accent)}
.boxlist{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.boxlist div{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:4px 8px;font-size:12px;color:var(--muted)}
.boxlist button{border:0;background:none;color:var(--danger);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--muted)}
.kv b{color:var(--text);font-weight:500}

/* 畫布區 */
#stageWrap{position:relative;background:var(--stage);min-width:0;min-height:0;overflow:hidden}
#stage,#vstage{position:absolute;inset:0}
#view,#vview{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#vstage{display:none;flex-direction:column}
#vstage .vcanvas{position:relative;flex:1;min-height:0}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty .box{pointer-events:auto;text-align:center;max-width:380px;padding:30px;border:1.5px dashed #3c414b;border-radius:16px}
.empty .box h1{font-size:22px;margin:10px 0 6px;font-weight:700}
.empty .box p{color:var(--muted);line-height:1.7;margin:0 0 16px}
.empty svg{width:48px;height:48px;color:var(--accent)}
#stageWrap.dragover::after{content:"放開以新增";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);background:#0006;pointer-events:none}
.chipbar{position:absolute;left:50%;transform:translateX(-50%);top:12px;display:none;gap:8px;align-items:center;background:#000a;border:1px solid #fff2;border-radius:999px;padding:5px 6px 5px 14px;font-size:12px;backdrop-filter:blur(6px)}
.chipbar button{border:0;background:#ffffff1a;border-radius:999px;padding:4px 10px;font-size:12px;color:#fff}
.hint{position:absolute;left:12px;bottom:12px;color:#fff9;font-size:12px;background:#0007;padding:4px 10px;border-radius:999px;pointer-events:none}

/* 影片時間軸 */
.vbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
.vbar input[type=range]{flex:1;accent-color:var(--accent)}
.vbar .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:110px;text-align:right}
.vresult{position:absolute;inset:0;background:var(--stage);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.vresult video{max-width:100%;max-height:calc(100% - 70px);border-radius:8px;background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/20px 20px}
.vresult .acts{display:flex;gap:8px}

/* 生成中 */
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#14161acc;backdrop-filter:blur(3px);z-index:20}
#busy .in{width:min(360px,86%);text-align:center}
#busy .ring{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),#ffffff1a 0);display:grid;place-items:center;transition:background .2s}
#busy .ring span{width:68px;height:68px;border-radius:50%;background:#1c1f25;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
#busy .ring.indet{background:conic-gradient(var(--accent) 0 25%,#ffffff1a 0);animation:spin 1s linear infinite}
#busy .ring.indet span{animation:spin 1s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#busy h4{margin:0 0 4px;font-size:16px}
#busy p{margin:0 0 4px;color:var(--muted);font-size:12px;min-height:18px;line-height:1.6}
#busy .btn{margin-top:12px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:50;pointer-events:none}
#toast div{background:#111418;border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;max-width:520px;box-shadow:0 6px 20px #0008}
#toast div.err{border-color:var(--danger)}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:min(640px,92vw)}
dialog::backdrop{background:#0009}
dialog header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
dialog header h2{margin:0;font-size:16px}
dialog .body{padding:14px 20px 20px;max-height:70vh;overflow:auto}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.mrow b{font-size:13px}
.mrow small{color:var(--muted);font-size:12px;grid-column:1}
.mrow .st{font-size:12px}
.mrow .st.ok{color:var(--ok)}
.mrow .acts{grid-row:1/3;grid-column:2;display:flex;gap:6px}

@media (max-width:900px){
  #app{grid-template-columns:64px 250px 1fr}
  .rb{font-size:11px}
  #top{gap:8px;overflow-x:auto}
  .brand a{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><span>PochiEdit</span><a href="mobile.html" title="切換到手機版">手機版</a></div>
  <nav class="pages" aria-label="頁面">
    <button data-page="image" class="on">圖片編輯</button>
    <button data-page="video">影片工具</button>
  </nav>
  <div class="tb" id="imgTb">
    <button class="ib" id="btnUndo" title="復原（Ctrl+Z）" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="btnRedo" title="重做（Ctrl+Shift+Z）" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="ib" id="btnReset" title="一鍵重置回原圖" disabled>重置</button>
    <button class="ib hold" id="btnHold" title="按住對比原圖" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>按住對比</button>
    <span class="sep"></span>
    <button class="ib" id="btnZoomOut" title="縮小">−</button>
    <span id="zoomLbl">100%</span>
    <button class="ib" id="btnZoomIn" title="放大">＋</button>
    <button class="ib" id="btnFit" title="符合視窗">符合</button>
  </div>
  <div class="spacer"></div>
  <button class="ib" id="btnModels" title="AI 模型設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg>AI 模型</button>
  <div class="export" id="expBox">
    <select id="expFmt" aria-label="匯出格式"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select>
    <label id="expQWrap" hidden>品質 <input type="range" id="expQ" min="50" max="100" value="92"></label>
    <button class="btn primary" id="btnExport">匯出圖片</button>
  </div>
</header>

<main id="app">
  <nav id="rail" aria-label="工具"></nav>
  <section id="panel"></section>
  <section id="stageWrap">
    <div id="stage">
      <canvas id="view"></canvas>
      <div class="empty" id="empty">
        <div class="box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          <h1>放一張圖片進來</h1>
          <p>拖曳到這裡、按 Ctrl+V 貼上，或從電腦選擇。<br>所有處理都在你的瀏覽器內完成，不會上傳。</p>
          <button class="btn primary" data-act="pick">選擇圖片</button>
        </div>
      </div>
      <div class="chipbar" id="cmpBar">左右拖曳分隔線比較前後<button id="cmpClose">關閉對比</button></div>
      <div class="hint" id="hint">滾輪縮放 · 按住空白鍵拖曳畫面</div>
    </div>
    <div id="vstage">
      <div class="vcanvas">
        <canvas id="vview"></canvas>
        <div class="empty" id="vempty">
          <div class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
            <h1>放一段影片進來</h1>
            <p>支援 MP4 與 WebM，處理後保留聲音。<br>影片只在瀏覽器裡逐格處理，不會上傳。</p>
            <button class="btn primary" data-act="pickVideo">選擇影片</button>
          </div>
        </div>
        <div class="chipbar" id="vcmpBar">這是目前畫格的預覽，左右拖曳比較<button id="vcmpClose">關閉預覽</button></div>
        <div class="vresult" id="vresult">
          <video id="vresVideo" controls playsinline></video>
          <div class="acts"><button class="btn primary" id="vresDl">下載影片</button><button class="btn" id="vresClose">回到編輯</button></div>
        </div>
      </div>
      <div class="vbar" id="vbar" hidden>
        <button class="ib" id="vPlay" title="播放／暫停"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></button>
        <input type="range" id="vSeek" min="0" max="1" step="0.01" value="0" aria-label="時間軸">
        <span class="t" id="vTime">0:00.0 / 0:00.0</span>
      </div>
    </div>
    <div id="busy" role="alertdialog" aria-live="polite">
      <div class="in">
        <div class="ring" id="busyRing"><span id="busyPct">0%</span></div>
        <h4 id="busyTitle">生成中</h4>
        <p id="busyMsg"></p>
        <p id="busyEta"></p>
        <button class="btn" id="busyCancel">取消</button>
      </div>
    </div>
  </section>
</main>

<dialog id="dlgModels">
  <header><h2>AI 模型</h2><button class="ib" id="dlgClose" aria-label="關閉">✕</button></header>
  <div class="body" id="dlgBody"></div>
</dialog>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileVideo" accept="video/mp4,video/webm,video/*" hidden>
<input type="file" id="fileModel" accept=".onnx" hidden>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5/build/webm-muxer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>
<script>
'use strict';
/* ====================== 基本工具 ====================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function c2d(c) { return c.getContext('2d', { willReadFrequently: true }); }
function cloneCanvas(src) { const c = mkCanvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); return c; }
function getData(c) { return c2d(c).getImageData(0, 0, c.width, c.height); }
function resizeCanvas(src, w, h) {
  // 逐步縮小，畫質較好
  let cur = src, cw = src.width, ch = src.height;
  while (cw / 2 >= w * 1.0001 && ch / 2 >= h * 1.0001) {
    cw = Math.round(cw / 2); ch = Math.round(ch / 2);

  if (!vc) throw new Error(proc.alpha ? '這個瀏覽器無法輸出透明影片，請改選綠幕或其他背景' : `這個瀏覽器無法把 ${W}×${H} 編碼成 ${fmt.toUpperCase()}，請改用另一種格式或較小的倍率`);
  // 聲音：解碼成 48kHz 再重新編碼
  task.status('讀取聲音…');
  let abuf = null; try { const ab = await V.file.arrayBuffer(); abuf = await new OfflineAudioContext(2, 1, 48000).decodeAudioData(ab); } catch { abuf = null; }
  const nCh = abuf ? Math.min(2, abuf.numberOfChannels) : 0, acodec = abuf && 'AudioEncoder' in window ? await pickAudioCodec(fmt, nCh) : null;
  if (abuf && !acodec) toast('這個瀏覽器無法編碼聲音，輸出的影片會沒有聲音');
  const target = new Mux.ArrayBufferTarget();
  const mopts = fmt === 'webm'
    ? { target, video: { codec: vc.mux, width: W, height: H, frameRate: fps, alpha: !!proc.alpha }, firstTimestampBehavior: 'offset' }
    : { target, video: { codec: 'avc', width: W, height: H, frameRate: fps }, fastStart: 'in-memory', firstTimestampBehavior: 'offset' };
  if (acodec) mopts.audio = { codec: acodec.mux, sampleRate: 48000, numberOfChannels: nCh };
  const muxer = new Mux.Muxer(mopts);
  const aChunks = [];
  if (acodec) {
    task.status('編碼聲音…');
    let aErr = null; const enc = new AudioEncoder({ output: (c, m) => aChunks.push([c, m]), error: e => aErr = e });
    enc.configure(acodec.cfg);
    const len = abuf.length, CH = 4800, chans = [...Array(nCh)].map((_, c) => abuf.getChannelData(c));
    for (let off = 0; off < len; off += CH) {
      const n = Math.min(CH, len - off), data = new Float32Array(n * nCh);
      for (let c = 0; c < nCh; c++) data.set(chans[c].subarray(off, off + n), c * n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: nCh, timestamp: Math.round(off / 48000 * 1e6), data });
      enc.encode(ad); ad.close();
      if (enc.encodeQueueSize > 50) await sleep(1);
    }
    await enc.flush(); enc.close(); if (aErr) throw aErr;
  }
  let ai = 0; const pushAudio = ts => { while (ai < aChunks.length && aChunks[ai][0].timestamp <= ts) { muxer.addAudioChunk(aChunks[ai][0], aChunks[ai][1]); ai++; } };
  let vErr = null;
  const venc = new VideoEncoder({ output: (c, m) => { pushAudio(c.timestamp); muxer.addVideoChunk(c, m); }, error: e => vErr = e });
  venc.configure(vc.cfg);
  const v = document.createElement('video'); v.src = V.url; v.muted = true; v.playsInline = true; v.preload = 'auto';
  await waitLoaded(v);
  const total = Math.max(1, Math.floor(V.dur * fps)), src = mkCanvas(V.w, V.h), sx = src.getContext('2d');
  const encC = mkCanvas(W, H), ex = encC.getContext('2d'), t0 = performance.now(), gop = Math.max(1, Math.round(fps * 2));
  proc.reset?.();
  try {
    for (let i = 0; i < total; i++) {
      task.check(); if (vErr) throw vErr;
      await seekTo(v, Math.min(V.dur - .001, (i + .5) / fps));
      sx.clearRect(0, 0, V.w, V.h); sx.drawImage(v, 0, 0, V.w, V.h);
      let out = await proc.fn(src, i); task.check();
      if (out.width !== W || out.height !== H) { ex.clearRect(0, 0, W, H); ex.drawImage(out, 0, 0, W, H); out = encC; }
      const fr = new VideoFrame(out, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps), alpha: proc.alpha ? 'keep' : 'discard' });
      venc.encode(fr, { keyFrame: i % gop === 0 }); fr.close();
      while (venc.encodeQueueSize > 3) await sleep(4);
      const el = (performance.now() - t0) / 1000;
      task.progress((i + 1) / total, `第 ${i + 1} / ${total} 格（${fps} fps）`, fmtEta(el / (i + 1) * (total - i - 1)));
    }
    task.status('封裝影片…');
    await venc.flush(); if (vErr) throw vErr;
  } finally { try { venc.close(); } catch { } v.removeAttribute('src'); v.load(); }
  pushAudio(Infinity); muxer.finalize();
  return { blob: new Blob([target.buffer], { type: fmt === 'webm' ? 'video/webm' : 'video/mp4' }), fmt, suffix: proc.suffix };
}
// 備援：瀏覽器的 VideoEncoder 不支援透明通道時，改用 MediaRecorder 逐格錄製（暫停/繼續控制時間）
async function recordAlphaWebM(task, proc, W, H, fps) {
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) throw new Error('這個瀏覽器無法輸出透明影片，請改選綠幕或其他背景');
  toast('透明影片改用瀏覽器錄製方式輸出，這種方式不含聲音；需要聲音請改選綠幕');
  const rc = mkCanvas(W, H), rx = rc.getContext('2d'), stream = rc.captureStream(0), track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: Math.round(clamp(W * H * fps * .12, 2e6, 30e6)) });
  const parts = []; rec.ondataavailable = e => { if (e.data.size) parts.push(e.data); };
  const v = document.createElement('video'); v.src = V.url; v.muted = true; v.playsInline = true; v.preload = 'auto';
  await waitLoaded(v);
  const total = Math.max(1, Math.floor(V.dur * fps)), src = mkCanvas(V.w, V.h), sx = src.getContext('2d'), t0 = performance.now();
  proc.reset?.(); rec.start(); rec.pause();
  try {
    for (let i = 0; i < total; i++) {
      task.check();
      await seekTo(v, Math.min(V.dur - .001, (i + .5) / fps));
      sx.clearRect(0, 0, V.w, V.h); sx.drawImage(v, 0, 0, V.w, V.h);
      const out = await proc.fn(src, i); task.check();
      rx.clearRect(0, 0, W, H); rx.drawImage(out, 0, 0, W, H);
      rec.resume(); track.requestFrame(); await sleep(1000 / fps); rec.pause();
      const el = (performance.now() - t0) / 1000;
      task.progress((i + 1) / total, `第 ${i + 1} / ${total} 格（${fps} fps，透明）`, fmtEta(el / (i + 1) * (total - i - 1)));
    }
    task.status('封裝影片…');
    rec.resume(); await sleep(60);
    await new Promise(r => { rec.onstop = r; rec.stop(); });
  } catch (e) { try { rec.stop(); } catch { } throw e; }
  finally { track.stop(); v.removeAttribute('src'); v.load(); }
  return { blob: new Blob(parts, { type: 'video/webm' }), fmt: 'webm', suffix: proc.suffix + '_透明' };
}
function vPreview() {
  if (!V.video) return;
  if (!V.video.paused) V.video.pause();
  runTask('生成中', async task => {
    const proc = await makeProcessor(task), src = grabFrame();
    task.status('處理目前畫格…');
    const out = await proc.fn(src, 0); task.check();
    V.before = src; V.preview = cloneCanvas(out); V.cmp = .5; $('#vcmpBar').style.display = 'flex'; vRender();
  });
}
function vStart() {
  if (!V.video) return;
  if (!V.video.paused) V.video.pause();
  vClearPreview();
  runTask('生成中', async task => {
    const proc = await makeProcessor(task), res = await encodeVideo(task, proc);
    if (V.result) URL.revokeObjectURL(V.result.url);
    const base = (V.file.name || '影片').replace(/\.[^.]+$/, '');
    V.result = { ...res, url: URL.createObjectURL(res.blob), name: `${base}_${res.suffix}.${res.fmt}` };
    $('#vresVideo').src = V.result.url; $('#vresult').style.display = 'flex';
    toast(`完成！${(res.blob.size / 1048576).toFixed(1)} MB`);
  });
}
$('#vresDl').onclick = () => V.result && download(V.result.blob, V.result.name);
$('#vresClose').onclick = () => { $('#vresVideo').pause(); $('#vresult').style.display = 'none'; vRender(); };

function vRenderPanel() {
  const T = { vwm: ['影片去水印', '框住畫面上位置固定的水印、台標或 Logo，AI 會逐格填補，並保留聲音。'], vmatte: ['影片去背', '逐格辨識人物或主體並去除背景，保留聲音。'], vup: ['影片放大', '用 AI 逐格把影片放大 2 倍或 4 倍，最大到 4K。'] }[V.tool];
  let h = `<h2>${T[0]}</h2><p class="lead">${T[1]}</p>`;
  if (!V.video) { panel.innerHTML = h + `<div class="drop">${svg('upload')}<b>拖曳影片到這裡</b><small>MP4 或 WebM</small><button class="btn primary" data-act="pickVideo">選擇影片</button></div>`; return; }
  h += `<div class="sec"><div class="kv"><span>檔案</span><b style="word-break:break-all">${V.file.name}</b><span>尺寸</span><b>${V.w} × ${V.h}</b><span>長度</span><b>${fmtTime(V.dur)}（約 ${Math.floor(V.dur * V.fps)} 格）</b></div>
    <button class="btn block" data-act="pickVideo" style="margin-top:10px">更換影片</button></div>`;
  if (V.tool === 'vwm') {
    h += `<div class="sec"><h3>框選水印</h3><p class="note">先拖動時間軸找到水印清楚的畫面，再拖曳框住，可框多個。</p>${boxListHTML(V.boxes)}${V.boxes.length ? '<button class="btn block" id="vbClear">清除框選</button>' : ''}</div>
      <div class="sec">${toggle('vSmooth', '減少填補閃爍', '讓前後畫格的補圖更一致', V.wmSmooth)}<p class="note">使用 MI-GAN 填補（${MODELS.migan.size}）。</p></div>`;
  } else if (V.tool === 'vmatte') {
    h += `<div class="sec"><h3>辨識對象</h3><div class="seg"><button data-vk="person" class="${V.kind === 'person' ? 'on' : ''}">人物</button><button data-vk="subject" class="${V.kind === 'subject' ? 'on' : ''}">主體</button></div>
      <p class="note">${V.kind === 'person' ? '人物使用 MODNet 人像模型，頭髮邊緣較細緻。' : '主體使用 U²-Net-p，適合商品、寵物等。'}</p></div>
      <div class="sec"><h3>背景</h3><div class="chips">${VBG.map(([k, l]) => `<button class="chip ${V.bg === k ? 'on' : ''}" data-vbg="${k}">${l}</button>`).join('')}</div>
      ${V.bg === 'color' ? `<div class="row"><label>顏色</label><input type="color" id="vColor" value="${V.color}"></div>` : ''}
      ${V.bg === 'none' ? '<p class="note">透明背景會輸出成 WebM（VP9 透明通道）。</p>' : ''}</div>
      <div class="sec">${toggle('vFlick', '減少邊緣閃爍', '參考前一格平滑邊緣，動作很快時可關閉', V.flicker)}</div>`;
  } else {
    const d = vUpDims();
    h += `<div class="sec"><h3>模型</h3>${UPSCALE_MODELS.map(m => `<button class="card ${V.upModel === m.key ? 'on' : ''}" data-vum="${m.key}"><b>${m.title}</b><span>${m.desc}</span></button>`).join('')}</div>
      <div class="sec"><h3>倍率</h3><div class="seg"><button data-vus="2" class="${V.upScale === 2 ? 'on' : ''}">2 倍</button><button data-vus="4" class="${V.upScale === 4 ? 'on' : ''}">4 倍</button></div>
      <div class="kv" style="margin-top:10px"><span>輸出</span><b>${d.s > 1.001 ? `${d.w} × ${d.h}` : '已達 4K，不需放大'}</b></div>
      ${d.capped && d.s > 1.001 ? '<p class="note">超過 4K 的部分已自動限制在 4K 以內。</p>' : ''}
      <p class="note">影片放大非常耗時，每一格都要分塊經過 AI，建議先用短片段試試。</p></div>`;
  }
  const alpha = V.tool === 'vmatte' && V.bg === 'none';
  h += `<div class="sec"><h3>輸出</h3><div class="row"><label>格式</label><div class="seg" style="flex:1"><button data-vf="mp4" class="${!alpha && V.fmt === 'mp4' ? 'on' : ''}" ${alpha ? 'disabled' : ''}>MP4</button><button data-vf="webm" class="${alpha || V.fmt === 'webm' ? 'on' : ''}">WebM</button></div></div>
    <div class="row"><label>畫格率</label><select id="vFps" style="flex:1">${[...new Set([V.fpsDetected, 24, 25, 30, 60])].map(f => `<option value="${f}" ${V.fps === f ? 'selected' : ''}>${f} fps${f === V.fpsDetected ? '（偵測值）' : ''}</option>`).join('')}</select></div></div>
    <div class="grid2"><button class="btn" id="vPrev">預覽目前畫格</button><button class="btn primary" id="vGo">開始處理</button></div>`;
  panel.innerHTML = h; bindRows(panel);
  onClick(panel, '[data-del]', b => { V.boxes.splice(+b.dataset.del, 1); renderPanel(); vRender(); });
  $('#vbClear') && ($('#vbClear').onclick = () => { V.boxes = []; renderPanel(); vRender(); });
  $('#vSmooth')?.addEventListener('change', e => V.wmSmooth = e.target.checked);
  $('#vFlick')?.addEventListener('change', e => V.flicker = e.target.checked);
  onClick(panel, '[data-vk]', b => { V.kind = b.dataset.vk; vClearPreview(); renderPanel(); vRender(); });
  onClick(panel, '[data-vbg]', b => { V.bg = b.dataset.vbg; vClearPreview(); renderPanel(); vRender(); });
  $('#vColor')?.addEventListener('input', e => V.color = e.target.value);
  onClick(panel, '[data-vum]', b => { V.upModel = b.dataset.vum; renderPanel(); });
  onClick(panel, '[data-vus]', b => { V.upScale = +b.dataset.vus; renderPanel(); });
  onClick(panel, '[data-vf]', b => { V.fmt = b.dataset.vf; renderPanel(); });
  $('#vFps').onchange = e => { V.fps = +e.target.value; renderPanel(); };
  $('#vPrev').onclick = vPreview; $('#vGo').onclick = vStart;
}

/* ====================== 頁面切換、匯出、模型、初始化 ====================== */
function setPage(p) {
  if (currentTask || S.page === p) { if (S.page === p) { renderRail(); renderPanel(); } return; }
  if (p === 'video' && S.tool === 'text' && S.texts.length) { pushHist(); S.img = baked(); S.texts = []; S.selText = null; }
  S.page = p;
  $$('.pages button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  $('#stage').style.display = p === 'image' ? '' : 'none';
  $('#vstage').style.display = p === 'video' ? 'flex' : 'none';
  $('#imgTb').style.visibility = p === 'image' ? 'visible' : 'hidden';
  $('#expBox').style.visibility = p === 'image' ? 'visible' : 'hidden';
  if (p === 'image') V.video?.pause();
  renderRail(); renderPanel(); resizeView(); if (p === 'video') vRender(); else updateTopbar();
}
$$('.pages button').forEach(b => b.onclick = () => setPage(b.dataset.page));
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'pick') $('#fileImg').click(); else if (a.dataset.act === 'pickVideo') $('#fileVideo').click();
});
$('#fileImg').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadImageFile(f); });
$('#fileVideo').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadVideoFile(f); });
const sw = $('#stageWrap');
sw.addEventListener('dragover', e => { e.preventDefault(); sw.classList.add('dragover'); });
sw.addEventListener('dragleave', e => { if (!sw.contains(e.relatedTarget)) sw.classList.remove('dragover'); });
sw.addEventListener('drop', e => {
  e.preventDefault(); sw.classList.remove('dragover'); if (currentTask) return;
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (f.type.startsWith('video/') || /\.(mp4|webm|m4v|mov)$/i.test(f.name)) { if (S.page !== 'video') setPage('video'); loadVideoFile(f); }
  else { if (S.page !== 'image') setPage('image'); loadImageFile(f); }
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
window.addEventListener('paste', e => {
  if (isTyping() || currentTask) return;
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) { e.preventDefault(); if (S.page !== 'image') setPage('image'); loadImageFile(it.getAsFile()); }
});
$('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo; $('#btnReset').onclick = resetAll;
$('#btnFit').onclick = fitView;
$('#btnZoomIn').onclick = () => { const r = stageRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
$('#btnZoomOut').onclick = () => { const r = stageRect(); zoomAt(.8, r.width / 2, r.height / 2); };
$('#cmpClose').onclick = () => { S.compare = null; updateTopbar(); requestRender(); };
const hb = $('#btnHold');
hb.addEventListener('pointerdown', () => { if (!S.orig) return; S.holdOrig = true; requestRender(); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => hb.addEventListener(ev, () => { if (S.holdOrig) { S.holdOrig = false; requestRender(); } }));
hb.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { S.holdOrig = true; requestRender(); } });
hb.addEventListener('keyup', () => { S.holdOrig = false; requestRender(); });
$('#expFmt').onchange = e => $('#expQWrap').hidden = e.target.value === 'png';
$('#btnExport').onclick = async () => {
  if (!S.img) return toast('請先新增圖片');
  if (S.preview && (S.tool === 'color' || S.tool === 'matte')) toast(S.tool === 'color' ? '提醒：調色還沒套用，匯出的是套用前的圖片' : '提醒：摳圖還沒套用，匯出的是套用前的圖片');
  const fmt = $('#expFmt').value, q = +$('#expQ').value / 100;
  let c = baked();
  if (fmt === 'jpeg') { const w = mkCanvas(c.width, c.height), x = w.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w.width, w.height); x.drawImage(c, 0, 0); c = w; }
  c.toBlob(b => { if (!b) return toast('匯出失敗，圖片可能太大', 'err'); download(b, `PochiEdit_${stamp()}.${fmt === 'jpeg' ? 'jpg' : fmt}`); toast('已匯出'); }, 'image/' + fmt, q);
};
/* 模型設定 */
async function renderModelDlg() {
  const rows = await Promise.all(Object.entries(MODELS).map(async ([k, m]) => {
    const st = localModels[k] ? '<span class="st ok">已從本機載入</span>' : (await isCached(k)) ? '<span class="st ok">已下載</span>' : '<span class="st">尚未下載</span>';
    return `<div class="mrow"><b>${m.name} · ${m.size} ${st}</b><small>${m.use}</small><div class="acts"><button class="btn" data-dl="${k}">下載</button><button class="btn" data-local="${k}">選擇本機檔</button></div></div>`;
  }));
  $('#dlgBody').innerHTML = `<p class="note">AI 在你的瀏覽器裡執行，目前使用 ${backendLabel}。模型第一次使用時會從 Hugging Face 下載並存在瀏覽器裡，下次不用再下載。若網路無法連到 Hugging Face，可以先取得 .onnx 檔再從本機載入。</p>${rows.join('')}
    <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn danger" id="mClear">清除已下載的模型</button></div>`;
  onClick($('#dlgBody'), '[data-dl]', b => { $('#dlgModels').close(); runTask('下載模型', async t => { await getSession(b.dataset.dl, t); toast(`${MODELS[b.dataset.dl].name} 已就緒`); }); });
  onClick($('#dlgBody'), '[data-local]', b => { const f = $('#fileModel'); f.dataset.key = b.dataset.local; f.click(); });
  $('#mClear').onclick = async () => { try { await caches.delete('pochiedit-models-v1'); } catch { } Object.keys(sessions).forEach(k => delete sessions[k]); toast('已清除'); renderModelDlg(); };
}
$('#btnModels').onclick = () => { renderModelDlg(); $('#dlgModels').showModal(); };
$('#dlgClose').onclick = () => $('#dlgModels').close();
$('#fileModel').addEventListener('change', async e => {
  const f = e.target.files[0], k = e.target.dataset.key; e.target.value = ''; if (!f || !k) return;
  localModels[k] = new Uint8Array(await f.arrayBuffer()); delete sessions[k];
  toast(`${MODELS[k].name} 會改用本機檔案`); renderModelDlg();
});

new ResizeObserver(() => resizeView()).observe($('#stageWrap'));
renderRail(); renderPanel(); updateTopbar(); resizeView();
if (!window.ort) toast('AI 執行環境載入失敗，請確認網路後重新整理', 'err');
