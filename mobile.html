<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PochiEdit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>PochiEdit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif:ital,wght@0,700;1,700;1,900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif:ital,wght@0,700;1,700;1,900&display=swap"></noscript>
<style>
:root{
  --bg:#f6f4f6; --card:#ffffff; --ink:#221c20; --muted:#8c8189; --line:#ece5ea;
  --rose:#ff4d8d; --rose-d:#e3346f; --rose-soft:#ffe3ee; --lav:#8f7cff; --lav-soft:#ece8ff;
  --stage:#ebe7ea; --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.logo{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-style:italic;font-weight:900;letter-spacing:.01em}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding-top:var(--top);background:var(--bg)}
.screen.on{display:flex}

/* 首頁 */
#home{overflow-y:auto;padding:calc(var(--top) + 8px) 18px calc(var(--bot) + 24px)}
.h-top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 18px}
.h-top .logo{font-size:30px}
.h-top a{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border-radius:22px;padding:18px 16px 16px;text-align:left;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:#fff;position:relative;overflow:hidden}
.big svg{position:absolute;right:12px;top:12px;width:44px;height:44px;opacity:.9}
.big b{font-size:21px;font-weight:900}
.big span{font-size:12px;opacity:.9;line-height:1.5}
.big.b1{background:linear-gradient(150deg,#ff7aa8,#ff4d8d 55%,#f0306f)}
.big.b2{background:linear-gradient(150deg,#b2a3ff,#8f7cff 55%,#6f5cf0)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;background:var(--card);border-radius:22px;padding:14px 8px}
.gi{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0;font-size:12.5px;color:var(--ink)}
.gi i{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose-d)}
.gi:nth-child(even) i{background:var(--lav-soft);color:#5f4ce0}
.gi svg{width:24px;height:24px}
.foot{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin:22px 0 0}

/* 編輯器 */
.e-top{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 10px;background:var(--card);flex:none}
.e-top .mid{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:disabled{opacity:.3}
.ib svg{width:22px;height:22px}
.pill{background:var(--rose);color:#fff;font-weight:700;border-radius:999px;padding:8px 18px;font-size:14px}
.pill.ghost{background:var(--rose-soft);color:var(--rose-d)}
.stage{position:relative;flex:1;min-height:0;background:var(--stage);overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cmp{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#fffffff0;box-shadow:0 2px 10px #0002;display:grid;place-items:center}
.cmp svg{width:22px;height:22px}
.cmp:active{background:var(--rose);color:#fff}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000a;color:#fff;font-size:12px;padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.panel{background:var(--card);flex:none;padding-bottom:var(--bot);border-top-left-radius:18px;border-top-right-radius:18px;margin-top:-14px;position:relative;z-index:2;box-shadow:0 -4px 18px #0000000d}
.seg2{display:flex;justify-content:center;gap:22px;padding:12px 0 2px}
.seg2 button{font-size:14px;color:var(--muted);padding:4px 2px;position:relative}
.seg2 button.on{color:var(--ink);font-weight:700}
.seg2 button.on::after{content:"";position:absolute;left:50%;bottom:-4px;width:16px;height:3px;border-radius:2px;background:var(--rose);transform:translateX(-50%)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:10px 8px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink)}
.tab i{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.tab svg{width:23px;height:23px}
.opts{padding:12px 14px 4px;max-height:42vh;overflow-y:auto}
.tbar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 8px;border-top:1px solid var(--line)}
.tbar span{font-weight:700;font-size:14px}
.tbar .ib svg{width:24px;height:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--bg);font-size:13px;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--rose);color:#fff;font-weight:700}
.sl{display:flex;align-items:center;gap:10px;padding:6px 2px}
.sl label{flex:none;font-size:13px;color:var(--muted);min-width:44px}
.sl input{flex:1;min-width:0;accent-color:var(--rose);height:28px}
.sl output{width:34px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sw{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--rose)}
.sw.trans{background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/12px 12px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.th{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.th canvas,.th .ph{width:64px;height:64px;border-radius:12px;border:2px solid transparent;display:block;background:var(--bg)}
.th.on canvas,.th.on .ph{border-color:var(--rose)}
.th.on{color:var(--rose-d);font-weight:700}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:170px;overflow-y:auto}
.emo button{font-size:26px;height:42px;border-radius:10px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo button:active{background:var(--bg)}
.row{display:flex;gap:8px;align-items:center;padding:4px 0}
.btn{flex:1;padding:11px 12px;border-radius:14px;background:var(--bg);font-size:14px;text-align:center;font-weight:500}
.btn.main{background:var(--rose);color:#fff;font-weight:700}
.btn:disabled{opacity:.4}
.note{color:var(--muted);font-size:12px;line-height:1.6;margin:6px 0}
.mkl{font-size:12px;color:var(--muted);margin:2px 0 4px}
textarea.tx{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;resize:none;background:var(--bg);font-size:16px}
.tstyles{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tstyles button{flex:none;width:68px;height:44px;border-radius:12px;background:#3b3540;border:2px solid transparent;display:grid;place-items:center}
.tstyles button.on{border-color:var(--rose)}
.tstyles canvas{width:60px;height:28px}
.sub-top{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 10px;background:var(--card);flex:none}
.sub-top b{font-size:16px}
.sub-opts{background:var(--card);padding:12px 14px calc(var(--bot) + 12px);max-height:46vh;overflow-y:auto;flex:none}
.fields input{width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg);font-size:16px;margin:4px 0}

#busy{position:fixed;inset:0;background:#1f1a1ecc;display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#busy .in{width:min(300px,82%);text-align:center;color:#fff}
.ring{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:conic-gradient(var(--rose) calc(var(--p,0)*1%),#ffffff26 0);display:grid;place-items:center}
.ring span{width:70px;height:70px;border-radius:50%;background:#2a2428;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.ring.indet{background:conic-gradient(var(--rose) 0 25%,#ffffff26 0);animation:spin 1s linear infinite}
.ring.indet span{animation:spin 1s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#busy h4{margin:0 0 6px;font-size:17px}
#busy p{margin:0 0 4px;font-size:12.5px;opacity:.8;line-height:1.6;min-height:18px}
#busy button{margin-top:14px;padding:9px 26px;border-radius:999px;background:#ffffff22;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 120px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none;width:90%}
#toast div{background:#221c20ee;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;text-align:center;max-width:100%}
#toast div.err{background:#c02a5aee;border-radius:14px}
/* 前後對比線 */
.cmp.split{right:64px}
.cmp.on{background:var(--rose);color:#fff}
/* 可以回頭修改的工具 */
.tab i{position:relative}
.tab.re i::after{content:"";position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--rose);border:2px solid var(--card)}
/* HSL */
.hdots{display:flex;justify-content:space-between;gap:6px;padding:2px 2px 6px}
.hdot{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);position:relative}
.hdot.on{box-shadow:0 0 0 2px var(--ink)}
.hdot.set::after{content:"";position:absolute;left:50%;bottom:-9px;width:4px;height:4px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.hname{font-size:13px;font-weight:700;margin:6px 2px 0}
/* 曲線 */
.curve{display:block;width:min(100%,250px,30vh);aspect-ratio:1;margin:2px auto 4px;border-radius:14px;background:var(--bg);touch-action:none}
/* 配方 */
.rcp{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.rcp::-webkit-scrollbar{display:none}
.rc{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;position:relative}
.rc canvas{width:72px;height:72px;border-radius:14px;border:2px solid transparent;display:block;background:var(--bg)}
.rc.on canvas{border-color:var(--rose)}
.rc.on{color:var(--rose-d);font-weight:700}
.rc span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc em{position:absolute;top:5px;left:5px;font-style:normal;font-size:10px;line-height:1;background:#fffffff0;color:var(--rose-d);border-radius:999px;padding:3px 6px}
.sec-t{font-size:13px;font-weight:700;margin:14px 2px 2px}
.fld{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--bg);font-size:16px}
.btn.fit{flex:none;padding:11px 18px}
.inst{display:inline-block;margin-top:10px;font-size:12px;color:var(--rose-d);background:var(--rose-soft);border-radius:999px;padding:6px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (min-width:700px){#home{padding-left:calc(50% - 320px);padding-right:calc(50% - 320px)}}
</style>
</head>
<body>
<div id="home" class="screen on">
  <header class="h-top"><div class="logo">PochiEdit</div><a href="index.html?desktop=1">電腦版</a></header>
  <section class="hero">
    <button class="big b1" data-go="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L6 20"/></svg><b>美化圖片</b><span>裁剪、濾鏡、文字<br>貼紙、邊框、消除</span></button>
    <button class="big b2" data-go="beauty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/><path d="M19 3l.8 1.7L21.5 5.5l-1.7.8L19 8l-.8-1.7L16.5 5.5l1.7-.8z"/></svg><b>人像美容</b><span>磨皮、瘦臉、大眼<br>美妝、瘦身、增高</span></button>
  </section>
  <section class="grid" id="homeGrid"></section>
  <p class="foot">照片只在你的手機裡處理，不會上傳。<br>免費、沒有廣告。<br><button class="inst" id="inst" hidden>加到主畫面，像 App 一樣打開</button></p>
</div>

<div id="editor" class="screen">
  <header class="e-top">
    <button class="ib" id="eBack" aria-label="回首頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="mid">
      <button class="ib" id="eUndo" aria-label="復原" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="ib" id="eRedo" aria-label="重做" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <button class="pill" id="eSave">儲存</button>
  </header>
  <div class="stage" id="eStage">
    <canvas id="ev"></canvas>
    <button class="cmp split" id="eSplit" aria-label="左右對比"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m7 9-3 3 3 3M17 9l3 3-3 3"/></svg></button>
    <button class="cmp" id="eCmp" aria-label="按住看原圖"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16"/></svg></button>
    <div class="hint" id="eHint" hidden></div>
  </div>
  <div class="panel">
    <div id="eTool" hidden>
      <div class="opts" id="eOpts"></div>
      <div class="tbar"><button class="ib" id="tX" aria-label="取消"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span id="tName"></span><button class="ib" id="tOK" aria-label="套用"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></button></div>
    </div>
    <div id="eMain">
      <div class="seg2"><button data-grp="edit" class="on">美化</button><button data-grp="beauty">人像美容</button></div>
      <div class="tabs" id="eTabs"></div>
    </div>
  </div>
</div>

<div id="sub" class="screen">
  <header class="sub-top">
    <button class="ib" id="sBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <b id="sTitle"></b>
    <button class="pill" id="sNext">下一步</button>
  </header>
  <div class="stage" id="sStage"><canvas id="sv"></canvas></div>
  <div class="sub-opts" id="sOpts"></div>
</div>

<div id="busy" role="alertdialog" aria-live="polite"><div class="in">
  <div class="ring" id="bRing"><span id="bPct"></span></div>
  <h4 id="bTitle">處理中</h4><p id="bMsg"></p><p id="bEta"></p>
  <button id="bCancel">取消</button>
</div></div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fMulti" accept="image/*" multiple hidden>
<input type="file" id="fBg" accept="image/*" hidden>
<script>
'use strict';
/* ========== 基本工具 ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function c2d(c) { return c.getContext('2d', { willReadFrequently: true }); }
function cloneCanvas(src) { const c = mkCanvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); return c; }
function getData(c) { return c2d(c).getImageData(0, 0, c.width, c.height); }
function putData(id) { const c = mkCanvas(id.width, id.height); c2d(c).putImageData(id, 0, 0); return c; }
function resizeCanvas(src, w, h) {
  let cur = src, cw = src.width, ch = src.height;
  while (cw / 2 >= w * 1.0001 && ch / 2 >= h * 1.0001) { cw = Math.round(cw / 2); ch = Math.round(ch / 2); const t = mkCanvas(cw, ch), x = t.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, cw, ch); cur = t; }
  const out = mkCanvas(w, h), o = out.getContext('2d'); o.imageSmoothingQuality = 'high'; o.drawImage(cur, 0, 0, w, h); return out;
}
function fitInto(src, maxSide) { const k = Math.min(1, maxSide / Math.max(src.width, src.height)); return k < 1 ? resizeCanvas(src, Math.round(src.width * k), Math.round(src.height * k)) : src; }
function hasAlpha(c) { const d = getData(c).data; for (let i = 3; i < d.length; i += 4 * 11) if (d[i] < 250) return true; return false; }
function toast(msg, type = '') { const el = document.createElement('div'); el.textContent = msg; if (type) el.className = type; $('#toast').appendChild(el); setTimeout(() => el.remove(), type === 'err' ? 5500 : 2600); }
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function fmtEta(sec) { if (!isFinite(sec) || sec <= 0) return ''; sec = Math.round(sec); return sec < 60 ? `剩約 ${sec} 秒` : `剩約 ${Math.floor(sec / 60)} 分 ${sec % 60} 秒`; }
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// 讀入的照片解析度：一般手機照片（1200 萬畫素）保留原尺寸不縮小；記憶體小的手機才降一級
const LOW_MEM = (navigator.deviceMemory || 8) <= 3;
const MAX_SIDE = LOW_MEM ? 3072 : 4096, LOAD_AREA = LOW_MEM ? 7.1e6 : 12.6e6, MAX_AREA = 16e6;
const JPEG_Q = .97;   // 存檔畫質

function coverDraw(ctx, img, x, y, w, h, o = { dx: 0, dy: 0, z: 1 }) {
  const k = Math.max(w / img.width, h / img.height) * (o.z || 1), dw = img.width * k, dh = img.height * k;
  const mx = (dw - w) / 2, my = (dh - h) / 2; o.dx = clamp(o.dx || 0, -mx, mx); o.dy = clamp(o.dy || 0, -my, my);
  ctx.drawImage(img, x + (w - dw) / 2 + o.dx, y + (h - dh) / 2 + o.dy, dw, dh);
}

/* ---------- 拼圖 ---------- */
const CO = { imgs: [], li: 0, ratio: 1, gap: 14, rad: 0, bg: '#ffffff', off: [], sel: -1 };
function partitions(n, maxParts = 3, maxEach = 4) {
  const out = []; const rec = (left, parts) => { if (!left) { if (parts.length) out.push(parts); return; } if (parts.length >= maxParts) return; for (let k = 1; k <= Math.min(maxEach, left); k++) rec(left - k, [...parts, k]); };
  rec(n, []); return out.sort((a, b) => Math.abs(a.length - 2) - Math.abs(b.length - 2));
}
function layoutsFor(n) {
  if (n === 1) return [[[0, 0, 1, 1]]];
  const L = [], seen = new Set();
  partitions(n).forEach(parts => {
    const rows = parts.map((c, ri) => [...Array(c)].map((_, ci) => [ci / c, ri / parts.length, 1 / c, 1 / parts.length])).flat();
    const cols = parts.map((c, ci) => [...Array(c)].map((_, ri) => [ci / parts.length, ri / c, 1 / parts.length, 1 / c])).flat();
    [rows, cols].forEach(l => { const k = JSON.stringify(l); if (!seen.has(k)) { seen.add(k); L.push(l); } });
  });
  return L.slice(0, 10);
}
function coCells(W, H) { const g = CO.gap / 1000 * Math.min(W, H); return layoutsFor(CO.imgs.length)[CO.li].map(([x, y, w, h]) => ({ x: g + x * (W - g), y: g + y * (H - g), w: w * (W - g) - g, h: h * (H - g) - g })); }

async function startCollage() {

/* ---------- 證件照 ---------- */
const ID_SIZES = [['2in', '2 吋', 35, 45, .72], ['1in', '1 吋', 28, 35, .7], ['pass', '護照／身分證', 35, 45, .76]];
const ID_BG = [['#ffffff', '白'], ['#dce9f7', '淺藍'], ['#3a74c4', '藍'], ['#d0312d', '紅'], ['#ececec', '淺灰']];
const ID = { size: 'pass', bg: '#ffffff', sheet: false, src: null, fg: null, face: null, adj: { y: 0, z: 1 } };
function idSingle() {
  const sz = ID_SIZES.find(s => s[0] === ID.size), W = Math.round(sz[2] / 25.4 * 300), H = Math.round(sz[3] / 25.4 * 300);
  const f = ID.face, iw = ID.src.width, ih = ID.src.height, top0 = f[10].y * ih, chin = f[152].y * ih, crown = top0 - (chin - top0) * .48, cx = f[168].x * iw;
  const s = H * sz[4] / (chin - crown) * ID.adj.z, topM = H * .07 + ID.adj.y;
  const c = mkCanvas(W, H), x = c.getContext('2d'); x.fillStyle = ID.bg; x.fillRect(0, 0, W, H); x.imageSmoothingQuality = 'high';
  x.drawImage(ID.fg, W / 2 - cx * s, topM - crown * s, iw * s, ih * s); return c;
}
function idSheet(one) {
  const W = 1800, H = 1200, g = 20, c = mkCanvas(W, H), x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  const cols = Math.max(1, Math.floor((W - g) / (one.width + g))), rows = Math.max(1, Math.floor((H - g) / (one.height + g)));
  const ox = (W - cols * one.width - (cols - 1) * g) / 2, oy = (H - rows * one.height - (rows - 1) * g) / 2;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) { const px = ox + k * (one.width + g), py = oy + r * (one.height + g); x.drawImage(one, px, py); x.strokeStyle = '#cfcfcf'; x.lineWidth = 1; x.strokeRect(px - .5, py - .5, one.width + 1, one.height + 1); }
  return c;
}
function idUpdate() { const one = idSingle(); SUB.canvas = ID.sheet ? idSheet(one) : one; SUB.draw(); }
async function startID() {
  const f = await pickFile('#fImg'); if (!f) return;
  const ok = await runTask('製作證件照', async task => {
    const src = fitInto(await loadPhoto(f), 2000);
    const faces = await getFaces(task, src); task.check();
    if (!faces.length) throw new Error('找不到臉，請用正面、光線均勻的照片');
    const r = await segment(src, 'modnet', task); task.check();
    const fg = cloneCanvas(src), x = fg.getContext('2d'); x.globalCompositeOperation = 'destination-in'; x.imageSmoothingQuality = 'high'; x.drawImage(maskToCanvas(r.mask, r.w, r.h), 0, 0, src.width, src.height);
    Object.assign(ID, { src, fg, face: faces[0], adj: { y: 0, z: 1 } }); return true;
  });
  if (!ok) return;
  openSub('idphoto', '證件照', '儲存'); idUI(); idUpdate();
  SUB.next = () => saveCanvas(ID.sheet ? idSheet(idSingle()) : idSingle(), 'PochiEdit_證件照');
}
function idUI() {
  $('#sOpts').innerHTML = chips(ID_SIZES.map(s => [s[0], s[1]]), ID.size, 'is') +
    `<div class="chips" style="gap:12px">${ID_BG.map(([c, l]) => `<button class="sw ${ID.bg === c ? 'on' : ''}" data-ib="${c}" style="background:${c}" aria-label="${l}"></button>`).join('')}</div>` +
    chips([['0', '單張'], ['1', '4×6 相紙排版']], ID.sheet ? '1' : '0', 'ish') + sl('idY', '上下', -60, 60, ID.adj.y) + sl('idZ', '大小', 80, 120, Math.round(ID.adj.z * 100)) +
    `<p class="note">台灣護照、身分證：白色背景，頭頂到下巴 3.2–3.6 公分。輸出為 300 dpi，可直接拿去沖印。</p>`;
  bindSliders($('#sOpts'));
  on($('#sOpts'), '[data-is]', b => { ID.size = b.dataset.is; idUI(); idUpdate(); });
  on($('#sOpts'), '[data-ib]', b => { ID.bg = b.dataset.ib; idUI(); idUpdate(); });
  on($('#sOpts'), '[data-ish]', b => { ID.sheet = b.dataset.ish === '1'; idUI(); idUpdate(); });
  $('#idY').addEventListener('input', e => { ID.adj.y = +e.target.value; idUpdate(); });
  $('#idZ').addEventListener('input', e => { ID.adj.z = +e.target.value / 100; idUpdate(); });
}
